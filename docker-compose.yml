# =================================================================
# TTC Fleet360 - run the whole system with one command:
#
#     docker compose up --build
#
# Then open http://localhost:8080
# Login: admin@ttcfleet360.com / Admin@123
#
# Services:
#   postgres  - database                (port 5432)
#   redis     - cache / token blacklist (port 6379)
#   minio     - local S3 for logo files (console: http://localhost:9001)
#   backend   - Node.js API             (port 5000)
#   frontend  - React app via nginx     (port 8080)
# =================================================================
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
      POSTGRES_DB: fleet360
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet360"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  # One-time job: create the bucket and make files publicly readable
  minio-setup:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 2; done;
      mc mb --ignore-existing local/fleet360;
      mc anonymous set download local/fleet360;
      "

  backend:
    build: ./backend
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      minio-setup: { condition: service_completed_successfully }
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgres://fleet:fleet@postgres:5432/fleet360
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-local-docker-secret-change-me-in-real-deployments}
      CORS_ORIGIN: http://localhost:8080
      S3_BUCKET: fleet360
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_URL: http://localhost:9000/fleet360
      AWS_REGION: ap-south-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      SEED_DEMO: "true"          # demo branches/users/subscriptions on first start
    ports: ["5000:5000"]

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["8080:80"]

volumes:
  pgdata:
  miniodata:
