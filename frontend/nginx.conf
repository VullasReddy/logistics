# nginx config for the frontend container.
#  - Serves the React build
#  - Forwards /api and /uploads to the backend container
#  - Sends every other URL to index.html so React Router works on refresh
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 3m;   # logo uploads (backend allows 2 MB)

  location /api/ {
    proxy_pass http://backend:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /uploads/ {
    proxy_pass http://backend:5000;
  }

  location / {
    try_files $uri /index.html;
  }

  # Cache built JS/CSS for a long time (file names contain a hash)
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
